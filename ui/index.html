<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ПСБ — Юридический ассистент</title>
<style>
  :root{
    --bg:#fbf8f4;
    --sand:#f3ede4;
    --surface:#ffffff;
    --ink:#1c1b22;
    --muted:#646872;
    --line:#e8e2d9;
    --blue:#000f3c;
    --blue-deep:#000a2a;
    --blue-tint:rgba(0,15,60,.045);
    --blue-ring:rgba(0,15,60,.10);
    --orange:#ff6200;
    --ease:cubic-bezier(.2,.7,.3,1);
    /* типографика: одна шкала на весь экран */
    --inset:32px;
    --fs-answer:17px;   --lh-answer:26px;
    --fs-body:16px;     --lh-body:24px;
    --fs-title:15px;    --lh-title:22px;
    --fs-meta:12px;     --lh-meta:18px;
    --fs-label:11px;    --lh-label:16px;
    --fs-quote:13px;    --lh-quote:20px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:Inter, 'Liberation Sans', 'Nimbus Sans', Arial, 'Helvetica Neue', sans-serif;
    font-size:var(--fs-body);
    line-height:var(--lh-body);
    font-feature-settings:"kern" 1, "liga" 1;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
    display:flex;
    flex-direction:column;
    padding:0 0 24px;
  }
  .shell{width:min(720px, calc(100% - 80px));margin:0 auto;}
  header{
    flex:0 0 auto;
    position:sticky;top:0;z-index:10;
    background:rgba(251,248,244,.86);
    backdrop-filter:blur(10px) saturate(1.05);
    -webkit-backdrop-filter:blur(10px) saturate(1.05);
    border-bottom:1px solid transparent;
    transition:border-color .25s var(--ease), background .25s var(--ease);
  }
  header.scrolled{border-bottom-color:var(--line);background:rgba(251,248,244,.94);}
  .topbar{
    display:flex;align-items:center;justify-content:space-between;gap:16px;
    padding:20px 0;
  }
  .brand{display:flex;align-items:center;gap:14px;text-decoration:none;color:inherit;}
  .brand .logo{
    display:block;height:26px;width:auto;
    align-self:center;
    transition:opacity .2s var(--ease), transform .25s var(--ease);
  }
  .brand:hover .logo{opacity:.86;}
  .brand .rule{width:1px;height:20px;background:var(--line);align-self:center;}
  .brand .name{
    font-weight:500;font-size:var(--fs-title);line-height:20px;letter-spacing:.1px;
  }
  .brand .name .sub{
    display:block;font-size:var(--fs-label);line-height:var(--lh-label);font-weight:400;
    color:var(--muted);letter-spacing:0;margin-top:1px;
  }
  .kb{
    display:flex;align-items:center;gap:8px;
    font-size:12px;color:var(--muted);
    padding:7px 12px 7px 10px;
    border:1px solid var(--line);
    border-radius:999px;
    background:rgba(255,255,255,.5);
    transition:border-color .2s var(--ease), background .2s var(--ease);
  }
  .kb:hover{border-color:rgba(0,15,60,.18);background:#fff;}
  .kb .dot{
    width:6px;height:6px;border-radius:50%;background:var(--orange);
    box-shadow:0 0 0 3px rgba(255,98,0,.10);
  }

  .window{
    flex:1 1 auto;min-height:0;
    display:flex;flex-direction:column;
    width:min(720px, calc(100% - 80px));
    margin:0 auto;
    background:#fffdfa;
    border:1px solid var(--line);
    border-radius:22px;
    box-shadow:0 1px 2px rgba(28,27,34,.03), 0 18px 40px -26px rgba(28,27,34,.22);
    overflow:hidden;
  }
  .pane{flex:1 1 auto;overflow-y:auto;padding:36px var(--inset) 24px;scroll-behavior:smooth;}
  .pane::-webkit-scrollbar{width:10px;}
  .pane::-webkit-scrollbar-track{background:transparent;}
  .pane::-webkit-scrollbar-thumb{
    background:rgba(0,15,60,.12);
    border:3px solid transparent;
    background-clip:content-box;
    border-radius:8px;
  }
  .pane::-webkit-scrollbar-thumb:hover{background:rgba(0,15,60,.24);background-clip:content-box;}
  .pane{scrollbar-width:thin;scrollbar-color:rgba(0,15,60,.18) transparent;}
  #thread{display:flex;flex-direction:column;gap:40px;}
  .turn{display:flex;flex-direction:column;gap:28px;}
  .turn.user{align-items:flex-end;}

  .bubble{
    background:var(--sand);
    border-radius:18px;
    padding:14px 18px;
    max-width:min(520px,90%);
    font-size:var(--fs-answer);
    line-height:var(--lh-answer);
    overflow-wrap:anywhere;
    animation:rise .3s var(--ease) both;
  }
  .answer{
    font-size:var(--fs-answer);line-height:var(--lh-answer);
    letter-spacing:-.01em;
    white-space:pre-wrap;
    overflow-wrap:break-word;
  }
  .answer.in{animation:rise .34s var(--ease) both;}
  .answer.muted{color:var(--muted);font-size:var(--fs-body);line-height:var(--lh-body);}
  .answer.loading{display:flex;align-items:center;gap:8px;height:26px;}

  .dots{display:inline-flex;gap:5px;align-items:center;}
  .dots i{
    width:6px;height:6px;border-radius:50%;
    background:var(--muted);
    opacity:.35;
    animation:pulse 1.15s var(--ease) infinite;
  }
  .dots i:nth-child(2){animation-delay:.14s;}
  .dots i:nth-child(3){animation-delay:.28s;}

  .sources{margin-top:26px;animation:rise .34s .06s var(--ease) both;}
  .sources-label{
    font-size:var(--fs-label);line-height:var(--lh-label);font-weight:600;
    letter-spacing:.09em;color:var(--muted);
    text-transform:uppercase;margin-bottom:4px;
  }
  .source{
    display:flex;align-items:flex-start;gap:12px;
    padding:12px;margin:0 -12px;
    border:0;border-radius:12px;
    background:none;
    font:inherit;text-align:left;
    cursor:pointer;width:calc(100% + 24px);
    transition:background .18s var(--ease);
  }
  .source:hover{background:var(--blue-tint);}
  .source:focus-visible{outline:2px solid var(--blue);outline-offset:2px;}
  .source .num{
    flex:0 0 auto;width:22px;height:22px;border-radius:11px;
    border:1px solid var(--blue);color:var(--blue);
    font-size:var(--fs-label);line-height:1;font-weight:500;
    font-variant-numeric:tabular-nums;
    display:flex;align-items:center;justify-content:center;
    transition:background .18s var(--ease), color .18s var(--ease);
  }
  .source:hover .num{background:var(--blue);color:#fff;}
  .source .body{display:flex;flex-direction:column;gap:1px;min-width:0;}
  .source .title{
    font-size:var(--fs-title);line-height:var(--lh-title);font-weight:500;color:var(--blue);
    text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px;
    overflow-wrap:anywhere;
    transition:color .18s var(--ease);
  }
  .source:hover .title{color:var(--orange);}
  .source .meta{font-size:var(--fs-meta);line-height:var(--lh-meta);color:var(--muted);}
  .source .arrow{
    flex:0 0 auto;color:var(--muted);
    font-size:var(--fs-title);line-height:var(--lh-title);margin-left:auto;
    transition:transform .18s var(--ease), color .18s var(--ease);
  }
  .source:hover .arrow{transform:translate(2px,-2px);color:var(--blue);}

  .quote-wrap{
    display:grid;grid-template-rows:0fr;opacity:0;
    transition:grid-template-rows .3s var(--ease), opacity .25s var(--ease);
  }
  .quote-wrap.open{grid-template-rows:1fr;opacity:1;}
  .quote-wrap > .clip{overflow:hidden;}
  .quote{
    margin:0 0 14px 34px;
    padding:12px 14px;
    background:var(--surface);
    border-left:2px solid var(--line);
    border-radius:6px;
    font-size:var(--fs-quote);line-height:var(--lh-quote);
    color:var(--muted);
    white-space:pre-wrap;
    overflow-wrap:break-word;
  }

  footer{
    flex:0 0 auto;
    border-top:1px solid var(--line);
    background:linear-gradient(to bottom, rgba(255,253,250,0), rgba(251,248,244,.75));
    padding:16px var(--inset) 20px;
  }
  form.composer{display:flex;flex-direction:column;gap:10px;}
  .input-row{
    display:flex;align-items:center;gap:14px;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:16px;
    padding:8px 8px 8px 18px;
    transition:border-color .2s var(--ease), box-shadow .2s var(--ease);
  }
  .input-row:focus-within{
    border-color:rgba(0,15,60,.45);
    box-shadow:0 0 0 4px var(--blue-ring);
  }
  #question{
    flex:1 1 auto;border:0;outline:none;background:none;
    font:inherit;font-size:var(--fs-body);line-height:22px;color:var(--ink);
    padding:8px 0;margin:0;
  }
  #question::placeholder{color:var(--muted);}

  .send{
    flex:0 0 auto;
    width:44px;height:44px;
    border:0;border-radius:22px;
    background:var(--blue);
    color:#fff;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 0 0 rgba(0,15,60,0);
    transition:background .2s var(--ease), transform .18s var(--ease), box-shadow .22s var(--ease);
  }
  .send svg{transition:transform .2s var(--ease);}
  .send:hover{background:var(--blue-deep);transform:translateY(-1px);box-shadow:0 8px 18px rgba(0,15,60,.26);}
  .send:hover svg{transform:translateX(2px);}
  .send:active{transform:translateY(0) scale(.94);box-shadow:0 3px 10px rgba(0,15,60,.22);}
  .send:focus-visible{outline:2px solid var(--blue);outline-offset:3px;}
  .send:disabled{opacity:.5;cursor:default;transform:none;box-shadow:none;}
  .send:disabled svg{transform:none;}
  .hint{font-size:var(--fs-meta);line-height:var(--lh-meta);color:var(--muted);padding:0 2px;}

  @keyframes rise{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
  @keyframes pulse{
    0%,100%{opacity:.25;transform:translateY(0);}
    40%{opacity:1;transform:translateY(-2px);}
  }

  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation:none !important;transition:none !important;}
    main{scroll-behavior:auto;}
  }
  @media (max-width:640px){
    :root{
      --inset:20px;
      --fs-answer:16px; --lh-answer:24px;
    }
    .shell{width:calc(100% - 40px);}
    .window{width:calc(100% - 28px);border-radius:18px;}
    .pane{padding:26px var(--inset) 18px;}
    .bubble{padding:12px 16px;}
  }
</style>
</head>
<body>
<header>
  <div class="shell topbar">
    <a class="brand" href="/">
      <img class="logo" src="/assets/psb-logo.png" alt="ПСБ" width="100" height="26">
      <span class="rule"></span>
      <span class="name">Юридический ассистент<span class="sub">Внутренние документы банка</span></span>
    </a>
  </div>
</header>

<main class="window">
  <div class="pane">
    <div id="thread"></div>
  </div>
  <footer>
    <form class="composer" id="composer" autocomplete="off">
      <div class="input-row">
        <input id="question" name="question" type="text" placeholder="Спросите по документам базы" required>
        <button class="send" id="send" type="submit" aria-label="Спросить">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
            <path d="M3 9h11M9.5 4.5 14 9l-4.5 4.5" stroke="currentColor" stroke-width="1.6"
                  stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
      <div class="hint">Ответы только по документам базы знаний банка</div>
    </form>
  </footer>
</main>

<script>
const thread = document.getElementById('thread');
const mainEl = document.querySelector('.pane');
const form = document.getElementById('composer');
const input = document.getElementById('question');
const send = document.getElementById('send');
let history = [];

const headerEl = document.querySelector('header');
mainEl.addEventListener('scroll', () => {
  headerEl.classList.toggle('scrolled', mainEl.scrollTop > 8);
});

function plural(n, one, few, many){
  const mod10 = n % 10, mod100 = n % 100;
  if (mod10 === 1 && mod100 !== 11) return n + ' ' + one;
  if (mod10 >= 2 && mod10 <= 4 && (mod100 < 12 || mod100 > 14)) return n + ' ' + few;
  return n + ' ' + many;
}

function el(tag, cls, text){
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
}
function scrollDown(){ mainEl.scrollTop = mainEl.scrollHeight; }

function addUser(text){
  const turn = el('div', 'turn user');
  turn.appendChild(el('div', 'bubble', text));
  thread.appendChild(turn);
  scrollDown();
  return turn;
}

function addAssistant(){
  const turn = el('div', 'turn');
  const answer = el('div', 'answer loading');
  answer.setAttribute('aria-label', 'Ищу в базе');
  const dots = el('span', 'dots');
  for (let i = 0; i < 3; i++) dots.appendChild(document.createElement('i'));
  answer.appendChild(dots);
  turn.appendChild(answer);
  thread.appendChild(turn);
  scrollDown();
  return {turn, answer};
}

function renderSources(turn, sources){
  if (!sources || !sources.length) return;
  const block = el('div', 'sources');
  block.appendChild(el('div', 'sources-label', 'Источники'));

  sources.forEach((s, i) => {
    const btn = el('button', 'source');
    btn.type = 'button';
    btn.setAttribute('aria-expanded', 'false');
    btn.appendChild(el('span', 'num', String(s.n || i + 1)));

    const body = el('span', 'body');
    body.appendChild(el('span', 'title', s.title || s.docId || 'Документ'));
    if (s.meta) body.appendChild(el('span', 'meta', s.meta));
    btn.appendChild(body);
    btn.appendChild(el('span', 'arrow', '\u2197'));

    const wrap = el('div', 'quote-wrap');
    const clip = el('div', 'clip');
    clip.appendChild(el('div', 'quote', s.snippet || 'Фрагмент не передан'));
    wrap.appendChild(clip);

    btn.addEventListener('click', () => {
      const open = wrap.classList.toggle('open');
      btn.setAttribute('aria-expanded', String(open));
    });

    block.appendChild(btn);
    block.appendChild(wrap);
  });
  turn.appendChild(block);
  scrollDown();
}

async function ask(question){
  addUser(question);
  const {turn, answer} = addAssistant();
  send.disabled = true;
  try {
    const res = await fetch('/api/ask', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({question, history})
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    answer.classList.remove('loading');
    answer.removeAttribute('aria-label');
    answer.textContent = data.answer || 'Ответ не сформирован';
    void answer.offsetWidth;
    answer.classList.add('in');
    renderSources(turn, data.sources);
    history.push({role: 'user', content: question});
    history.push({role: 'assistant', content: data.answer || ''});
  } catch (err) {
    answer.classList.remove('loading');
    answer.classList.add('muted', 'in');
    answer.textContent = 'Не удалось получить ответ: ' + err.message;
  } finally {
    send.disabled = false;
    input.focus();
    scrollDown();
  }
}

form.addEventListener('submit', (e) => {
  e.preventDefault();
  const q = input.value.trim();
  if (!q) return;
  input.value = '';
  ask(q);
});
</script>
</body>
</html>
